# Автоответ на сообщения покупателя в чате заказа. Скопируйте в configs/autoresponse.toml.
# Срабатывает, если сообщение целиком совпадает с одним из triggers (без учёта регистра).

[[command]]
triggers = ["!помощь", "!help"]
response = """Команды:
!заказ — данные заказа
!продавец — позвать продавца"""

[[command]]
triggers = ["!заказ"]
response = "Заказ $order_id: $product × $quantity на $amount ₽\n$fields"

[[command]]
triggers = ["!продавец"]
response = "Позвал продавца, он скоро ответит."
notify = true   # уведомить в Telegram, даже если уведомления о сообщениях выключены
