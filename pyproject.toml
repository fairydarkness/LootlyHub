[project]
name = "lootlyhub"
version = "0.1.0"
description = "Бот автоматизации магазина Lootly: автовыдача, автоответ, панель в Telegram"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "@fairydarkns" }]
dependencies = [
    "httpx>=0.27,<1",
    "aiogram>=3.15,<4",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["lootlyhub", "lootlyhub.api", "lootlyhub.tg"]
